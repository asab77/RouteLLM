name: routellm
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: routellm
      POSTGRES_USER: routellm_admin
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U routellm_admin -d routellm"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
volumes:
  postgres_data:
