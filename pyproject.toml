[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptive-llm-gateway"
version = "0.3.0"
description = "Provider-independent foundations for an adaptive LLM inference gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.29,<1", "alembic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_llm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: opt-in integration tests requiring TEST_DATABASE_URL"]
